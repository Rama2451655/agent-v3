name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build (prints Kotlin errors at the top of the run page)
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --warning-mode=none 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | while read -r line; do echo "::error::$line"; done
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Riya-APK
          path: app/build/outputs/apk/debug/app-debug.apk
